services:
  quota-peek:
    build: .
    image: quota-peek:latest
    container_name: quota-peek
    restart: unless-stopped
    ports:
      - "5928:5928"
    # Keys (GLM/VOLC/KIMI/MINIMAX _N accounts, plan labels, base URLs) come
    # straight from .env — no per-key wiring here; add a key to .env and it
    # just works. `environment` below overrides env_file on conflicts.
    env_file: .env
    environment:
      # The app computes "local" month/day boundaries (the DeepSeek month-spend
      # window) — pin the container to the operator's timezone.
      TZ: Asia/Shanghai
      # Hard fail-fast: GLM is the only required key.
      GLM_API_KEY: ${GLM_API_KEY:?GLM_API_KEY is required — set it in .env or your shell}
      # Container-internal secret paths (differ from host paths).
      CLAUDE_CREDENTIALS_PATH: /secrets/claude/.credentials.json
      GEMINI_CREDENTIALS_PATH: /secrets/gemini/antigravity-oauth-token
      CODEX_AUTH_PATH: /secrets/codex-auth.json
      GROK_AUTH_PATH: /secrets/grok/auth.json
      KIMI_CREDENTIALS_PATH: /secrets/kimi-creds.json
      # StepFun: Step Plan refresh tokens rotate on every renewal, so the rotated
      # pair must survive a recreate — losing it kills the session. Writable dir
      # (this is our cache file, not a CLI credential file).
      STEPFUN_SESSION_FILE: /secrets/stepfun/session.json
      MIMO_SESSION_FILE: /secrets/mimo/session.json
      # Usage history: the background sampler writes every poll here (see the
      # ./data volume below). QP_POLL=0 turns the sampler off — usage is then
      # recorded only when someone loads the dashboard.
      QP_POLL: ${QP_POLL:-1}
      QP_POLL_INTERVAL_MS: ${QP_POLL_INTERVAL_MS:-300000}
      QP_HISTORY_DAYS: ${QP_HISTORY_DAYS:-90}
    volumes:
      # Directory mounts: mount parent dirs so missing credential files don't cause
      # Docker daemon to create bogus directories on the host.
      - ${CLAUDE_DIR:-~/.claude}:/secrets/claude:ro
      - ${GEMINI_DIR:-~/.gemini/antigravity-cli}:/secrets/gemini
      - ${CODEX_AUTH:-~/.codex/auth.json}:/secrets/codex-auth.json:ro
      # Directory mount (rw): xAI refresh tokens rotate; write-back must hit the
      # same file the grok CLI reads. A file-only :ro mount burns the login.
      - ${GROK_DIR:-~/.grok}:/secrets/grok
      # Mounted read-only: in Docker prefer KIMI_API_KEY, since OAuth tokens
      # last ~15 min and refresh write-back needs a writable file.
      - ${KIMI_CREDENTIALS:-~/.kimi-code/credentials/kimi-code.json}:/secrets/kimi-creds.json:ro
      # StepFun session cache dir (created on first refresh, 0600 file inside).
      - ./stepfun-session:/secrets/stepfun
      # MiMo renewed-session cache dir (same pattern as StepFun: the rotated
      # seed + fresh ~24h cookie must survive a recreate).
      - ./mimo-session:/secrets/mimo
      # Usage history: the background sampler writes every poll here. Keep it
      # on a host directory so a recreate doesn't erase the timeline. The
      # container runs as uid 1000 (`node`); on macOS bind mounts that means
      # the directory has to be world-writable:
      #   mkdir -p data && chmod 777 data
      # (on Linux, `chown 1000:1000 data` instead).
      - ./data:/app/data
